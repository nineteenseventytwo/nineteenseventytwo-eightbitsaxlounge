---
- name: Initialize Windows PC for MIDI API hosting
  hosts: midi-host
  gather_facts: true
  vars:
    deploy_base: "C:\\Services\\Midi"
    ssh_key_name: "pi-to-midi-host"
    # ASP.NET Core, not the base runtime — midi/*.MinimalApi.csproj uses
    # Sdk="Microsoft.NET.Sdk.Web" and is framework-dependent (no
    # SelfContained), so it needs Microsoft.AspNetCore.App at run time. The
    # base-runtime check below used to look for Microsoft.NETCore.App, which
    # would have passed even on a machine that could not actually host this
    # app.
    dotnet_version: "10.0"
    midi_host:
      user: mchel
      # VLAN 20, not the pre-rebuild flat LAN. Kept in sync with the same
      # value in group_vars/all/vars.yaml's own midi_host — this play's
      # local vars take precedence for the {{ midi_host.ip }} template
      # expressions inside this file (the wait_for and SSH-test tasks
      # below), while the *inventory* connection itself resolves through
      # group_vars via templates/ansiblehosts.j2, so both need to agree or
      # this play tests connectivity to a different address than the one it
      # actually connected on.
      ip: 192.168.20.210
    nssm_version: "2.24"
    nssm_url: "https://nssm.cc/release/nssm-{{ nssm_version }}.zip"

  tasks:
    # ========== SSH Key Setup ==========
    - name: Generate SSH key pair on Pi (if not exists)
      delegate_to: localhost
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f ~/.ssh/{{ ssh_key_name }} -N "" -C "ansible-pi-to-midi"
        creates: "~/.ssh/{{ ssh_key_name }}"
      register: ssh_key_created

    - name: Read public key from Pi
      delegate_to: localhost
      ansible.builtin.slurp:
        src: "~/.ssh/{{ ssh_key_name }}.pub"
      register: ssh_pubkey

    - name: Ensure .ssh directory exists on Windows PC
      ansible.windows.win_file:
        path: "C:\\Users\\{{ midi_host.user }}\\.ssh"
        state: directory

    - name: Add Pi's public key to authorized_keys on Windows PC
      ansible.windows.win_copy:
        content: "{{ ssh_pubkey.content | b64decode | trim }}\n"
        dest: "C:\\Users\\{{ midi_host.user }}\\.ssh\\authorized_keys"

    - name: Set correct permissions on authorized_keys (Windows ACL)
      ansible.windows.win_shell: |
        $path = "C:\Users\{{ midi_host.user }}\.ssh\authorized_keys"
        icacls $path /inheritance:r
        icacls $path /grant:r "{{ midi_host.user }}:(F)"
        icacls $path /grant:r "SYSTEM:(F)"

    - name: Check if user is in Administrators group
      ansible.windows.win_shell: |
        net localgroup administrators | Select-String "{{ midi_host.user }}"
      register: is_admin
      failed_when: false
      changed_when: false

    - name: Add public key to administrators_authorized_keys (if admin)
      ansible.windows.win_copy:
        content: "{{ ssh_pubkey.content | b64decode | trim }}\n"
        dest: "C:\\ProgramData\\ssh\\administrators_authorized_keys"
      when: is_admin.rc == 0

    - name: Set permissions on administrators_authorized_keys (if admin)
      ansible.windows.win_shell: |
        icacls C:\ProgramData\ssh\administrators_authorized_keys /inheritance:r
        icacls C:\ProgramData\ssh\administrators_authorized_keys /grant "BUILTIN\Administrators:(F)"
        icacls C:\ProgramData\ssh\administrators_authorized_keys /grant "SYSTEM:(F)"
      when: is_admin.rc == 0

    - name: Restart SSH service to apply authorized_keys changes
      ansible.windows.win_service:
        name: sshd
        state: restarted

    - name: Wait for SSH to be ready
      ansible.builtin.wait_for:
        host: "{{ midi_host.ip }}"
        port: 22
        delay: 2
        timeout: 30
      delegate_to: localhost

    - name: Test passwordless SSH connection
      delegate_to: localhost
      ansible.builtin.command:
        cmd: ssh -i ~/.ssh/{{ ssh_key_name }} -o StrictHostKeyChecking=no {{ midi_host.user }}@{{ midi_host.ip }} "echo SSH key auth working"
      register: ssh_test
      changed_when: false

    - name: Print SSH test result
      ansible.builtin.debug:
        msg: "{{ ssh_test.stdout }}"

    # ========== Deployment Directory Structure ==========
    - name: Create deployment base directory
      ansible.windows.win_file:
        path: "{{ deploy_base }}"
        state: directory

    - name: Create dev environment directory
      ansible.windows.win_file:
        path: "{{ deploy_base }}\\dev"
        state: directory

    - name: Create prod environment directory
      ansible.windows.win_file:
        path: "{{ deploy_base }}\\prod"
        state: directory

    - name: Create logs directory
      ansible.windows.win_file:
        path: "{{ deploy_base }}\\logs"
        state: directory

    # ========== .NET Runtime Installation ==========
    - name: Check if ASP.NET Core {{ dotnet_version }} runtime is installed
      ansible.windows.win_shell: |
        dotnet --list-runtimes | Select-String "Microsoft.AspNetCore.App {{ dotnet_version }}"
      register: dotnet_check
      failed_when: false
      changed_when: false

    - name: Ensure Temp directory exists
      ansible.windows.win_file:
        path: "C:\\Temp"
        state: directory

    - name: Download ASP.NET Core {{ dotnet_version }} runtime installer (if needed)
      # aka.ms's channel redirect, not a hand-built download.visualstudio.microsoft.com
      # URL — that pattern needs an internal build id in place of the plain
      # version string and 400s on any version tried against it (verified
      # 2026-09-08 against the URL this file used to construct). This one
      # resolves to whatever the latest patch in the {{ dotnet_version }}
      # channel actually is, so it does not go stale the way a pinned patch
      # version would.
      ansible.windows.win_get_url:
        url: "https://aka.ms/dotnet/{{ dotnet_version }}/aspnetcore-runtime-win-x64.exe"
        dest: "C:\\Temp\\dotnet-runtime-installer.exe"
      when: dotnet_check.rc != 0
      register: dotnet_download

    - name: Install ASP.NET Core {{ dotnet_version }} runtime
      ansible.windows.win_package:
        path: "C:\\Temp\\dotnet-runtime-installer.exe"
        arguments: "/quiet /norestart"
        state: present
      when: dotnet_check.rc != 0

    - name: Verify .NET installation
      ansible.windows.win_shell: dotnet --list-runtimes
      register: dotnet_runtimes

    - name: Print installed .NET runtimes
      ansible.builtin.debug:
        msg: "{{ dotnet_runtimes.stdout_lines }}"

    # ========== NSSM (Service Manager) Installation ==========
    - name: Check if NSSM is installed
      ansible.windows.win_stat:
        path: "C:\\Tools\\nssm\\nssm.exe"
      register: nssm_check

    - name: Create NSSM directory
      ansible.windows.win_file:
        path: "C:\\Tools\\nssm"
        state: directory
      when: not nssm_check.stat.exists

    - name: Download NSSM
      ansible.windows.win_get_url:
        url: "{{ nssm_url }}"
        dest: "C:\\Temp\\nssm.zip"
      when: not nssm_check.stat.exists

    - name: Extract NSSM
      community.windows.win_unzip:
        src: "C:\\Temp\\nssm.zip"
        dest: "C:\\Temp\\nssm-extracted"
      when: not nssm_check.stat.exists

    - name: Copy NSSM executable to Tools
      ansible.windows.win_copy:
        src: "C:\\Temp\\nssm-extracted\\nssm-{{ nssm_version }}\\win64\\nssm.exe"
        dest: "C:\\Tools\\nssm\\nssm.exe"
        remote_src: true
      when: not nssm_check.stat.exists

    - name: Add NSSM to PATH
      ansible.windows.win_path:
        elements: "C:\\Tools\\nssm"
        scope: machine

    # ========== Firewall Rules ==========
    # VLAN 20, not the old flat-LAN /22. This is very likely the actual
    # cause of "the Windows side has been failing silently" — even with the
    # PC's own address corrected above, a rule scoped to the old subnet
    # denies every request the cluster (192.168.20.0/24) sends, and Windows
    # Firewall drops rather than rejects, so the symptom looks identical to
    # the service simply not running.
    - name: Allow MIDI API dev port (5000)
      community.windows.win_firewall_rule:
        name: "MIDI API Dev"
        localport: 5000
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true
        remoteip: 192.168.20.0/24

    - name: Allow MIDI API prod port (5001)
      community.windows.win_firewall_rule:
        name: "MIDI API Prod"
        localport: 5001
        action: allow
        direction: in
        protocol: tcp
        state: present
        enabled: true
        remoteip: 192.168.20.0/24

    # ========== Summary ==========
    - name: Print setup summary
      ansible.builtin.debug:
        msg:
          - "========== Setup Complete =========="
          - "Deployment base: {{ deploy_base }}"
          - "Dev directory: {{ deploy_base }}\\dev"
          - "Prod directory: {{ deploy_base }}\\prod"
          - "SSH key: ~/.ssh/{{ ssh_key_name }}"
          - "NSSM: C:\\Tools\\nssm\\nssm.exe"
          - ".NET runtimes installed"
          - "Firewall: Ports 5000 (dev) and 5001 (prod) open"
          - "===================================="
