---
# See midi-data-init.yaml's header comment for why this runs an in-cluster
# Job instead of curling the midi service's ClusterIP directly from a node
# (blocked by the tenant's default-deny NetworkPolicy).
- name: Upload MIDI Data
  hosts: master
  vars:
    k8s_namespace: "{{ lookup('env', 'NAMESPACE') | default('eightbitsaxlounge-dev', true) }}"
    upload_type: "{{ lookup('env', 'UPLOAD_TYPE') | default('effects', true) }}"
    device_names: "VentrisDualReverb"
    job_name: "midi-data-upload-{{ ansible_date_time.epoch }}"

  tasks:
    - name: Apply the upload Job
      ansible.builtin.shell: |
        set -eu
        cat <<'JOBEOF' | kubectl apply -f -
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: {{ job_name }}
          namespace: {{ k8s_namespace }}
        spec:
          backoffLimit: 0
          ttlSecondsAfterFinished: 300
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: upload
                  image: curlimages/curl:latest
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 100
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
                  env:
                    - name: CLIENT_ID
                      valueFrom:
                        secretKeyRef:
                          name: eightbitsaxlounge-midi-secrets
                          key: client-0-id
                    - name: CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: eightbitsaxlounge-midi-secrets
                          key: client-0-secret
                    - name: UPLOAD_TYPE
                      value: "{{ upload_type }}"
                    - name: DEVICE_NAMES
                      value: "{{ device_names }}"
                  command: ["sh", "-c"]
                  args:
                    - |
                      set -eu
                      TOKEN=$(curl -sf -X POST http://eightbitsaxlounge-midi-service:8080/api/token \
                        -H "Content-Type: application/json" \
                        -d "{\"ClientId\":\"$CLIENT_ID\",\"ClientSecret\":\"$CLIENT_SECRET\"}" \
                        | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                      if [ "$UPLOAD_TYPE" = "effects" ]; then
                        curl -sf -X POST http://eightbitsaxlounge-midi-service:8080/api/Midi/UploadEffects \
                          -H "Authorization: Bearer $TOKEN"
                      elif [ "$UPLOAD_TYPE" = "devices" ]; then
                        IFS=','
                        for name in $DEVICE_NAMES; do
                          echo "Uploading device: $name"
                          curl -sf -X POST "http://eightbitsaxlounge-midi-service:8080/api/Midi/UploadDevice/$name" \
                            -H "Authorization: Bearer $TOKEN"
                          echo
                        done
                      else
                        echo "Unknown UPLOAD_TYPE: $UPLOAD_TYPE" >&2
                        exit 1
                      fi
        JOBEOF
      register: apply_result

    - name: Wait for the Job to finish
      ansible.builtin.shell: |
        kubectl wait --for=condition=complete --timeout=60s job/{{ job_name }} -n {{ k8s_namespace }} \
          || kubectl wait --for=condition=failed --timeout=5s job/{{ job_name }} -n {{ k8s_namespace }} \
          || true
      register: wait_result
      changed_when: false

    - name: Fetch Job logs
      ansible.builtin.shell: |
        kubectl logs job/{{ job_name }} -n {{ k8s_namespace }} --tail=-1
      register: job_logs
      changed_when: false
      failed_when: false

    - name: Display upload result
      ansible.builtin.debug:
        msg: "{{ job_logs.stdout }}"

    - name: Check the Job actually succeeded
      ansible.builtin.shell: |
        kubectl get job/{{ job_name }} -n {{ k8s_namespace }} -o jsonpath='{.status.succeeded}'
      register: job_status
      changed_when: false

    - name: Clean up the Job
      ansible.builtin.shell: |
        kubectl delete job/{{ job_name }} -n {{ k8s_namespace }} --ignore-not-found
      changed_when: false

    - name: Fail if the Job did not succeed
      ansible.builtin.fail:
        msg: "Upload Job did not report success. See logs above."
      when: job_status.stdout != "1"
