---
# See midi-data-init.yaml's header comment for why this runs an in-cluster
# Job instead of curling the midi service's ClusterIP directly from a node
# (blocked by the tenant's default-deny NetworkPolicy).
- name: Send SetEffect Request to MIDI Service
  hosts: master
  vars:
    k8s_namespace: "{{ lookup('env', 'NAMESPACE') | default('eightbitsaxlounge-dev', true) }}"
    device: "{{ lookup('env', 'DEVICE') }}"
    device_effect: "{{ lookup('env', 'DEVICE_EFFECT') }}"
    device_effect_setting: "{{ lookup('env', 'DEVICE_EFFECT_SETTING') }}"
    value: "{{ lookup('env', 'VALUE') | default('', true) }}"
    selection: "{{ lookup('env', 'SELECTION') | default('', true) }}"
    job_name: "midi-seteffect-{{ ansible_date_time.epoch }}"

  tasks:
    - name: Validate required parameters
      ansible.builtin.fail:
        msg: "Required parameter missing: {{ item }}"
      when: vars[item] is not defined or vars[item] == ""
      loop:
        - device
        - device_effect
        - device_effect_setting

    - name: Apply the SetEffect Job
      ansible.builtin.shell: |
        set -eu
        cat <<'JOBEOF' | kubectl apply -f -
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: {{ job_name }}
          namespace: {{ k8s_namespace }}
        spec:
          backoffLimit: 0
          ttlSecondsAfterFinished: 300
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: seteffect
                  image: curlimages/curl:latest
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 100
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
                  env:
                    - name: CLIENT_ID
                      valueFrom:
                        secretKeyRef:
                          name: eightbitsaxlounge-midi-secrets
                          key: client-0-id
                    - name: CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: eightbitsaxlounge-midi-secrets
                          key: client-0-secret
                    - name: DEVICE
                      value: {{ device | to_json }}
                    - name: DEVICE_EFFECT
                      value: {{ device_effect | to_json }}
                    - name: DEVICE_EFFECT_SETTING
                      value: {{ device_effect_setting | to_json }}
                    - name: VALUE
                      value: {{ value | to_json }}
                    - name: SELECTION
                      value: {{ selection | to_json }}
                  command: ["sh", "-c"]
                  args:
                    - |
                      set -eu
                      TOKEN=$(curl -sf -X POST http://eightbitsaxlounge-midi-service:8080/api/token \
                        -H "Content-Type: application/json" \
                        -d "{\"ClientId\":\"$CLIENT_ID\",\"ClientSecret\":\"$CLIENT_SECRET\"}" \
                        | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                      if [ -n "${VALUE:-}" ]; then
                        BODY=$(printf '{"DeviceName":"%s","DeviceEffectName":"%s","DeviceEffectSettingName":"%s","Value":%s}' \
                          "$DEVICE" "$DEVICE_EFFECT" "$DEVICE_EFFECT_SETTING" "$VALUE")
                      else
                        BODY=$(printf '{"DeviceName":"%s","DeviceEffectName":"%s","DeviceEffectSettingName":"%s","Selection":"%s"}' \
                          "$DEVICE" "$DEVICE_EFFECT" "$DEVICE_EFFECT_SETTING" "$SELECTION")
                      fi
                      curl -sf -X POST http://eightbitsaxlounge-midi-service:8080/api/Midi/SetEffect \
                        -H "Content-Type: application/json" \
                        -H "Authorization: Bearer $TOKEN" \
                        -d "$BODY"
        JOBEOF
      register: apply_result

    - name: Wait for the Job to finish
      ansible.builtin.shell: |
        kubectl wait --for=condition=complete --timeout=60s job/{{ job_name }} -n {{ k8s_namespace }} \
          || kubectl wait --for=condition=failed --timeout=5s job/{{ job_name }} -n {{ k8s_namespace }} \
          || true
      register: wait_result
      changed_when: false

    - name: Fetch Job logs
      ansible.builtin.shell: |
        kubectl logs job/{{ job_name }} -n {{ k8s_namespace }} --tail=-1
      register: job_logs
      changed_when: false
      failed_when: false

    - name: Display SetEffect result
      ansible.builtin.debug:
        msg: "{{ job_logs.stdout }}"

    - name: Check the Job actually succeeded
      ansible.builtin.shell: |
        kubectl get job/{{ job_name }} -n {{ k8s_namespace }} -o jsonpath='{.status.succeeded}'
      register: job_status
      changed_when: false

    - name: Clean up the Job
      ansible.builtin.shell: |
        kubectl delete job/{{ job_name }} -n {{ k8s_namespace }} --ignore-not-found
      changed_when: false

    - name: Fail if the Job did not succeed
      ansible.builtin.fail:
        msg: "SetEffect Job did not report success. See logs above."
      when: job_status.stdout != "1"
