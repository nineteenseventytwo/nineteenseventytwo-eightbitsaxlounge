---
# Runs kubectl on a real cluster node (hosts: master) rather than curling
# the midi service's ClusterIP directly from here, which the tenant's
# default-deny NetworkPolicy silently drops — that traffic doesn't
# originate from a pod, so it matches no podSelector (confirmed live:
# times out from a node, 200s from an in-namespace pod). The actual HTTP
# calls run as a short-lived Job *inside* the target namespace instead,
# which is what a legitimate in-cluster caller looks like anyway. The
# Job pulls its client credentials straight from the same
# eightbitsaxlounge-midi-secrets Secret the midi Deployment itself reads
# (ExternalSecret-synced from Vault) — no client id/secret ever needs to
# pass through ansible or a GitHub secret for this.
- name: Initialize MIDI Datamodel
  hosts: master
  vars:
    k8s_namespace: "{{ lookup('env', 'NAMESPACE') | default('eightbitsaxlounge-dev', true) }}"
    job_name: "midi-data-init-{{ ansible_date_time.epoch }}"

  tasks:
    - name: Apply the init Job
      ansible.builtin.shell: |
        set -eu
        cat <<'JOBEOF' | kubectl apply -f -
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: {{ job_name }}
          namespace: {{ k8s_namespace }}
        spec:
          backoffLimit: 0
          ttlSecondsAfterFinished: 300
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: init
                  image: curlimages/curl:latest
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 100
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop: ["ALL"]
                    seccompProfile:
                      type: RuntimeDefault
                  env:
                    - name: CLIENT_ID
                      valueFrom:
                        secretKeyRef:
                          name: eightbitsaxlounge-midi-secrets
                          key: client-0-id
                    - name: CLIENT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: eightbitsaxlounge-midi-secrets
                          key: client-0-secret
                  command: ["sh", "-c"]
                  args:
                    - |
                      set -eu
                      TOKEN=$(curl -sf -X POST http://eightbitsaxlounge-midi-service:8080/api/token \
                        -H "Content-Type: application/json" \
                        -d "{\"ClientId\":\"$CLIENT_ID\",\"ClientSecret\":\"$CLIENT_SECRET\"}" \
                        | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
                      curl -sf -X POST http://eightbitsaxlounge-midi-service:8080/api/Midi/InitDatamodel \
                        -H "Authorization: Bearer $TOKEN"
        JOBEOF
      register: apply_result

    - name: Wait for the Job to finish
      ansible.builtin.shell: |
        kubectl wait --for=condition=complete --timeout=60s job/{{ job_name }} -n {{ k8s_namespace }} \
          || kubectl wait --for=condition=failed --timeout=5s job/{{ job_name }} -n {{ k8s_namespace }} \
          || true
      register: wait_result
      changed_when: false

    - name: Fetch Job logs
      ansible.builtin.shell: |
        kubectl logs job/{{ job_name }} -n {{ k8s_namespace }} --tail=-1
      register: job_logs
      changed_when: false
      failed_when: false

    - name: Display initialization result
      ansible.builtin.debug:
        msg: "{{ job_logs.stdout }}"

    - name: Check the Job actually succeeded
      ansible.builtin.shell: |
        kubectl get job/{{ job_name }} -n {{ k8s_namespace }} -o jsonpath='{.status.succeeded}'
      register: job_status
      changed_when: false

    - name: Clean up the Job
      ansible.builtin.shell: |
        kubectl delete job/{{ job_name }} -n {{ k8s_namespace }} --ignore-not-found
      changed_when: false

    - name: Fail if the Job did not succeed
      ansible.builtin.fail:
        msg: "Datamodel init Job did not report success. See logs above."
      when: job_status.stdout != "1"
