name: Chat Set Active Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Active environment (dev or prod)'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'

permissions:
  contents: read

jobs:
  switch-environment:
    name: Switch Active Chat Environment
    runs-on: self-hosted
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set Environment Variables
      run: |
        echo "ACTIVE_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
        if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
          echo "ACTIVE_NAMESPACE=eightbitsaxlounge-prod" >> $GITHUB_ENV
          echo "INACTIVE_NAMESPACE=eightbitsaxlounge-dev" >> $GITHUB_ENV
        else
          echo "ACTIVE_NAMESPACE=eightbitsaxlounge-dev" >> $GITHUB_ENV
          echo "INACTIVE_NAMESPACE=eightbitsaxlounge-prod" >> $GITHUB_ENV
        fi

    # See midi-data-init.yml for why this step and the SSH-cert one below
    # exist — same sibling-container-over-shared-docker-socket pattern
    # documented there. This workflow predates that fix (never carried it
    # over when midi's own data-* workflows got it), which is why it never
    # actually worked against the platform cluster.
    - name: Read the docker group gid
      id: dockergid
      run: |
        echo "value=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_OUTPUT"

    - name: Sign a fresh SSH certificate for this run
      env:
        VAULT_ADDR: https://vault.eightbitsaxlounge.com
      run: ../bootstrap/ssh/sign-ci.sh

    - name: Switch Chat Environment via Ansible
      working-directory: ./chat
      env:
        ACTIVE_NAMESPACE: ${{ env.ACTIVE_NAMESPACE }}
        INACTIVE_NAMESPACE: ${{ env.INACTIVE_NAMESPACE }}
        ACTIVE_ENV: ${{ env.ACTIVE_ENV }}
        DOCKER_GID: ${{ steps.dockergid.outputs.value }}
        ANSIBLE_CONSOLE_CERT: ${{ runner.temp }}/ansible-console-cert.pub
      run: make set-environment
