name: MIDI Request SetEffect

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      device:
        description: 'Device name'
        required: true
        default: 'VentrisDualReverb'
        type: choice
        options:
          - VentrisDualReverb
      device_effect:
        description: 'Device effect'
        required: true
        default: 'ReverbEngineA'
        type: choice
        options:
          - ReverbEngineA
          - ReverbEngineB
      device_effect_setting:
        description: 'Device effect setting'
        required: true
        default: 'ReverbEngine'
        type: choice
        options:
          - ReverbEngine
          - Time
          - PreDelay
          - Control1
          - Control2
      value:
        description: 'Value (optional integer)'
        required: false
        type: string
      selection:
        description: 'Selection (optional string)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  set-effect:
    name: Set MIDI Effect
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./midi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Namespace Based on Environment
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "NAMESPACE=eightbitsaxlounge-prod" >> $GITHUB_ENV
          else
            echo "NAMESPACE=eightbitsaxlounge-dev" >> $GITHUB_ENV
          fi

      # See midi-data-init.yml for why this step and the docker-gid one
      # below exist — same sibling-container-over-shared-docker-socket
      # pattern documented there.
      - name: Read the docker group gid
        id: dockergid
        run: |
          echo "value=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_OUTPUT"

      - name: Sign a fresh SSH certificate for this run
        env:
          VAULT_ADDR: https://vault.eightbitsaxlounge.com
        run: ../bootstrap/ssh/sign-ci.sh

      - name: Run Set Effect
        run: |
          make request-seteffect \
            DEVICE="${{ github.event.inputs.device }}" \
            DEVICE_EFFECT="${{ github.event.inputs.device_effect }}" \
            DEVICE_EFFECT_SETTING="${{ github.event.inputs.device_effect_setting }}" \
            VALUE="${{ github.event.inputs.value }}" \
            SELECTION="${{ github.event.inputs.selection }}"
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          DOCKER_GID: ${{ steps.dockergid.outputs.value }}
          ANSIBLE_CONSOLE_CERT: ${{ runner.temp }}/ansible-console-cert.pub
