name: Chat Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - chat/*
    paths:
      - 'chat/version.txt'

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  release:
    name: Release Chat Component
    # contents: read is required here, not just at the workflow's own
    # top-level permissions block above — a reusable-workflow call's own
    # top-level `permissions:` (release-template.yaml's is `contents:
    # read`) cannot exceed what THIS job grants, and job-level permissions
    # fully replace the workflow-level default for that job rather than
    # extending it. Without it: instant `startup_failure`, zero jobs
    # created, GitHub's only diagnostic being the generic "This run likely
    # failed because of a workflow file issue." Confirmed live 2026-09-08
    # with an isolated minimal reproduction — this omission is what broke
    # every *-release.yaml the moment the repo moved into an organization;
    # personal-account repos evidently did not enforce this ceiling as
    # strictly.
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: ./.github/workflows/release-template.yaml
    with:
      component: 'chat'
      test-target: 'test'
      # No deploy-target (ADR-0012): chat was migrated to
      # nineteenseventytwo-platform/apps/eightbitsaxlounge and is deployed
      # by Argo CD, not this repo. `make deploy` used to shell out to
      # `ansible-playbook chat-deploy.yaml`, and the self-hosted runner
      # never had ansible-playbook at all — every run since the migration
      # hit `Deploy Configuration`, failed with exit 127, and marked the
      # whole release red even though the image built, tested and
      # published fine. Both the Makefile target and the playbook are gone
      # now (Phase 6.2); omitting deploy-target here is what actually
      # skips that job (release-template.yaml treats an empty/omitted
      # deploy-target as "component is platform-deployed").
      requires-docker-login: true
    secrets:
      component-secrets: |
        {
          "TWITCH_CLIENT_ID": "${{ secrets.TWITCH_CLIENT_ID }}",
          "TWITCH_CLIENT_SECRET": "${{ secrets.TWITCH_CLIENT_SECRET }}",
          "MIDI_CLIENT_ID": "${{ secrets.MIDI_CLIENT_ID }}",
          "MIDI_CLIENT_SECRET": "${{ secrets.MIDI_CLIENT_SECRET }}"
        }
