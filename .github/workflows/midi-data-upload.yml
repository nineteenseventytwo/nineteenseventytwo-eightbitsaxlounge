name: MIDI Data Upload

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      upload_type:
        description: 'Type of data to upload'
        required: true
        default: 'effects'
        type: choice
        options:
          - effects
          - devices

permissions:
  contents: read

jobs:
  upload-data:
    name: Upload MIDI Data
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./midi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Namespace Based on Environment
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "NAMESPACE=eightbitsaxlounge-prod" >> $GITHUB_ENV
          else
            echo "NAMESPACE=eightbitsaxlounge-dev" >> $GITHUB_ENV
          fi

      # See midi-data-init.yml for why this step and the docker-gid one
      # below exist — same sibling-container-over-shared-docker-socket
      # pattern documented there.
      - name: Read the docker group gid
        id: dockergid
        run: |
          echo "value=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_OUTPUT"

      - name: Sign a fresh SSH certificate for this run
        env:
          VAULT_ADDR: https://vault.eightbitsaxlounge.com
        run: ../bootstrap/ssh/sign-ci.sh

      - name: Run Data Upload
        run: make data-upload UPLOAD_TYPE=${{ github.event.inputs.upload_type }}
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          DOCKER_GID: ${{ steps.dockergid.outputs.value }}
          ANSIBLE_CONSOLE_CERT: ${{ runner.temp }}/ansible-console-cert.pub
