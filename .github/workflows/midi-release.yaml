name: MIDI Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - midi/*
    paths:
      - 'midi/version.txt'

permissions:
  contents: write
  packages: write

jobs:
  # Check if we need to build before running expensive tests
  check-artifacts:
    name: Check if Artifacts Exist
    # GitHub-hosted (Phase 6.2): only GitHub API calls (curl/jq), no VLAN 20
    # or in-cluster access needed.
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
      namespace: ${{ steps.namespace.outputs.namespace }}
      needs-build-container: ${{ steps.check-container.outputs.needs-build }}
      needs-build-pc: ${{ steps.check-pc.outputs.needs-build }}
      needs-build: ${{ steps.determine.outputs.needs-build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Read Version
        id: version
        working-directory: ./midi
        run: |
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set Namespace
        id: namespace
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "namespace=eightbitsaxlounge-prod" >> $GITHUB_OUTPUT
          else
            echo "namespace=eightbitsaxlounge-dev" >> $GITHUB_OUTPUT
          fi

      - name: Check if container image exists
        id: check-container
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking for MIDI container version: $VERSION"

          # Use GitHub Packages API to check if the version exists
          # This is more reliable than the Docker registry API
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${{ github.repository_owner }}/packages/container/eightbitsaxlounge-midi/versions")

          echo "API Response Code: $RESPONSE"

          if [ "$RESPONSE" = "200" ]; then
            # Get the list of versions and check if our version exists
            VERSION_EXISTS=$(curl -s \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${{ github.repository_owner }}/packages/container/eightbitsaxlounge-midi/versions" \
              | jq -r --arg ver "$VERSION" '.[] | .metadata.container.tags[] | select(. == $ver)' | head -n 1)

            echo "Found matching tag: '$VERSION_EXISTS'"

            if [ -n "$VERSION_EXISTS" ]; then
              echo "needs-build=false" >> $GITHUB_OUTPUT
              echo "✓ Container image exists - will skip build and tests"
            else
              echo "needs-build=true" >> $GITHUB_OUTPUT
              echo "✗ Container image not found - will build and test"
            fi
          else
            # If we can't access the API (404, 403, etc.), assume it doesn't exist and build
            echo "needs-build=true" >> $GITHUB_OUTPUT
            echo "✗ Could not check container image (HTTP $RESPONSE) - will build and test"
          fi

      - name: Check if GitHub Release exists
        id: check-pc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="midi-api-v${{ steps.version.outputs.version }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG")

          if [ "$RESPONSE" = "200" ]; then
            echo "needs-build=false" >> $GITHUB_OUTPUT
            echo "✓ GitHub Release exists - will skip build"
          else
            echo "needs-build=true" >> $GITHUB_OUTPUT
            echo "✗ GitHub Release not found - will build"
          fi

      - name: Determine if any build needed
        id: determine
        run: |
          if [ "${{ steps.check-container.outputs.needs-build }}" = "true" ] || [ "${{ steps.check-pc.outputs.needs-build }}" = "true" ]; then
            echo "needs-build=true" >> $GITHUB_OUTPUT
            echo "Will run tests and build"
          else
            echo "needs-build=false" >> $GITHUB_OUTPUT
            echo "All artifacts exist - will skip tests and build"
          fi

  test:
    name: Run .NET Tests
    # GitHub-hosted (Phase 6.2): dotnet test, no VLAN 20 or docker needed.
    runs-on: ubuntu-24.04-arm
    needs: [check-artifacts]
    if: needs.check-artifacts.outputs.needs-build == 'true'
    env:
      # Dummy configuration for tests
      Authentication__SecretKey: "dummySecretKeyForTestingOnly1234567890123456789012"
      Authentication__Issuer: "Test"
      Authentication__Audience: "Test"
      Authentication__TokenExpiryInMinutes: "5"
      ConnectionStrings__EightBitSaxLoungeDataLayer: "http://localhost:5000"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET
        run: |
          DOTNET_DIR="$RUNNER_TOOL_CACHE/dotnet"
          if ! "$DOTNET_DIR/dotnet" --list-sdks 2>/dev/null | grep -q "^10\."; then
            curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$DOTNET_DIR"
          fi
          echo "$DOTNET_DIR" >> $GITHUB_PATH

      - name: Run tests
        working-directory: ./midi
        run: make test

  # Kubernetes container build
  build-container:
    name: Build MIDI Container
    needs: [check-artifacts, test]
    if: always() && needs.check-artifacts.outputs.needs-build-container == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    # GitHub-hosted (Phase 6.2): docker build+push, native arm64, no VLAN 20
    # needed — same reasoning as release-template.yaml's publish job.
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      security-events: write
    outputs:
      version: ${{ needs.check-artifacts.outputs.version }}
      namespace: ${{ needs.check-artifacts.outputs.namespace }}
      needs-build: ${{ needs.check-artifacts.outputs.needs-build-container }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container Image
        working-directory: ./midi
        env:
          VERSION: ${{ needs.check-artifacts.outputs.version }}
          NAMESPACE: ${{ needs.check-artifacts.outputs.namespace }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: make build-image

      - name: Test Built Image
        working-directory: ./midi
        env:
          VERSION: ${{ needs.check-artifacts.outputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: make test-image

      - name: Re-authenticate before push (prevent concurrent pipeline conflicts)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Container to Registry
        working-directory: ./midi
        env:
          VERSION: ${{ needs.check-artifacts.outputs.version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: make push

  # Windows PC build
  build-pc:
    name: Build Windows PC Package
    needs: [check-artifacts, test]
    if: always() && needs.check-artifacts.outputs.needs-build-pc == 'true' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    # GitHub-hosted (Phase 6.2): cross-compiles a win-x64 publish output —
    # no docker, no VLAN 20, no host-specific tooling needed to build it.
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ needs.check-artifacts.outputs.version }}
      needs-build: ${{ needs.check-artifacts.outputs.needs-build-pc }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Setup .NET
      run: |
        DOTNET_DIR="$RUNNER_TOOL_CACHE/dotnet"
        if ! "$DOTNET_DIR/dotnet" --list-sdks 2>/dev/null | grep -q "^10\."; then
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0 --install-dir "$DOTNET_DIR"
        fi
        echo "$DOTNET_DIR" >> $GITHUB_PATH

    - name: Publish Windows application
      working-directory: ./midi/NineteenSeventyTwo.EightBitSaxLounge.Midi
      run: |
        dotnet publish NineteenSeventyTwo.EightBitSaxLounge.Midi.MinimalApi/NineteenSeventyTwo.EightBitSaxLounge.Midi.MinimalApi.csproj \
          --configuration Release \
          --runtime win-x64 \
          --self-contained true \
          -p:PublishSingleFile=false \
          -p:Version=${{ needs.check-artifacts.outputs.version }} \
          --output ${{ github.workspace }}/midi/publish/bin

    - name: Create artifact archive
      working-directory: ./midi/publish/bin
      run: tar -czf ../midi-api-${{ needs.check-artifacts.outputs.version }}.tar.gz *

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: midi-api-${{ needs.check-artifacts.outputs.version }}
        path: midi/publish/midi-api-${{ needs.check-artifacts.outputs.version }}.tar.gz
        retention-days: 90
        compression-level: 0

    - name: Create GitHub Release
      if: github.ref_name == 'main'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: midi-api-v${{ needs.check-artifacts.outputs.version }}
        name: MIDI API v${{ needs.check-artifacts.outputs.version }}
        files: midi/publish/midi-api-${{ needs.check-artifacts.outputs.version }}.tar.gz
        body: |
          ## MIDI API Release v${{ needs.check-artifacts.outputs.version }}

          **Production deployment**
          - Self-contained Windows x64 binary
          - Deployed to: C:\Services\Midi\prod
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Kubernetes deployment: removed (Phase 6.2, 2026-09-12). This job only
  # ever ran `make deploy-k8s`, which shells out to ansible-playbook — not
  # present on the runner, and dead by design since midi moved to
  # nineteenseventytwo-platform/apps/eightbitsaxlounge (ADR-0012): Argo CD
  # deploys midi now, and racing it with a manual deploy step here was
  # never the plan (see midi/Makefile's own deploy-k8s comment). Every run
  # of this job failed with exit 127 and turned the whole release red even
  # though the container built, tested and published fine — same finding
  # already fixed for chat/db/data/state/overlay's `Deploy Configuration`
  # job. Left deliberately broken rather than fixed sooner specifically so
  # nobody was tempted to make it work and reintroduce the race.

  # Windows PC deployment
  #
  # Matrix, not a single run: midi-pc-deploy.yaml keys its target directory,
  # NSSM service name, and port entirely off an ENVIRONMENT env var this job
  # never used to set at all. Before this fix that meant every run silently
  # deployed once, defaulting to the "not dev" (prod-shaped) branch of every
  # ternary in that playbook — dev was never actually reached from CI.
  # Confirmed live 2026-09-10 running this by hand for both environments
  # instead. AUTHENTICATION__* stays one shared secret set across both legs
  # for now — a known gap, not an oversight: the k8s side moved to separate
  # per-environment Vault secrets during the platform migration, but the PC
  # side didn't follow. Low priority to close because the PC's device-mode
  # instance never actually validates a JWT in practice (it only checks
  # MidiDeviceService:BypassKey — see midi-deployment.yaml's own comment in
  # nineteenseventytwo-platform for why), so a mismatched signing key here
  # doesn't break anything functional today.
  deploy-pc:
    name: Deploy to Windows PC (${{ matrix.environment }})
    needs: [check-artifacts, build-pc, test]
    if: >-
      always() && (
        needs.check-artifacts.outputs.needs-build == 'false' ||
        (needs.build-pc.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped'))
      )
    runs-on: self-hosted
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Download artifact from workflow (if just built)
      if: needs.check-artifacts.outputs.needs-build-pc == 'true'
      uses: actions/download-artifact@v8
      with:
        name: midi-api-${{ needs.check-artifacts.outputs.version }}
        path: artifacts

    - name: Download artifact from GitHub Release (if using existing version)
      if: needs.check-artifacts.outputs.needs-build-pc == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        VERSION: ${{ needs.check-artifacts.outputs.version }}
      run: |
        mkdir -p artifacts
        curl -L -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/octet-stream" \
          "https://api.github.com/repos/$REPO/releases/tags/midi-api-v$VERSION" \
          | jq -r --arg name "midi-api-$VERSION.tar.gz" \
              '.assets[] | select(.name == $name) | .url' \
          | xargs -I {} curl -L -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/octet-stream" {} \
          -o "artifacts/midi-api-$VERSION.tar.gz"

    # ansible-playbook isn't installed on this runner's own image — see
    # midi/Makefile's own comment on ANSIBLE_RUNNER/DOCKER_USER for the
    # sibling-container pattern this feeds. pi-to-midi-host is a static
    # key already authorized directly on the PC (server/init-pc.yaml), not
    # a Vault-signed cert, so unlike the data-seeding workflows this only
    # needs the docker-gid step, not sign-ci.sh.
    - name: Read the docker group gid
      id: dockergid
      run: |
        echo "value=$(stat -c %g /var/run/docker.sock)" >> "$GITHUB_OUTPUT"

    - name: Deploy MIDI PC
      working-directory: ./midi
      env:
        ENVIRONMENT: ${{ matrix.environment }}
        VERSION: ${{ needs.check-artifacts.outputs.version }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        ARTIFACT_PATH: ${{ github.workspace }}/artifacts/midi-api-${{ needs.check-artifacts.outputs.version }}.tar.gz
        NEEDS_BUILD: ${{ needs.check-artifacts.outputs.needs-build-pc }}
        DOCKER_GID: ${{ steps.dockergid.outputs.value }}
        CONNECTIONSTRINGS__EIGHTBITSAXLOUNGEDATALAYER: ${{ matrix.environment == 'prod' && secrets.CONNECTIONSTRINGS_EIGHTBITSAXLOUNGEDATALAYER_PROD || secrets.CONNECTIONSTRINGS_EIGHTBITSAXLOUNGEDATALAYER_DEV }}
        AUTHENTICATION__TOKENEXPIRYINMINUTES: ${{ secrets.AUTHENTICATION_TOKENEXPIRYINMINUTES }}
        AUTHENTICATION__SECRETKEY: ${{ secrets.AUTHENTICATION_SECRETKEY }}
        AUTHENTICATION__ISSUER: ${{ secrets.AUTHENTICATION_ISSUER }}
        AUTHENTICATION__AUDIENCE: ${{ secrets.AUTHENTICATION_AUDIENCE }}
        AUTHENTICATION__CLIENTS__0__CLIENTID: ${{ secrets.AUTHENTICATION_CLIENTS_0_CLIENTID }}
        AUTHENTICATION__CLIENTS__0__CLIENTSECRET: ${{ secrets.AUTHENTICATION_CLIENTS_0_CLIENTSECRET }}
        AUTHENTICATION__CLIENTS__1__CLIENTID: ${{ secrets.AUTHENTICATION_CLIENTS_1_CLIENTID }}
        AUTHENTICATION__CLIENTS__1__CLIENTSECRET: ${{ secrets.AUTHENTICATION_CLIENTS_1_CLIENTSECRET }}
        MIDIDEVICESERVICE__BYPASSKEY: ${{ secrets.MIDI_DEVICE_BYPASS_KEY }}
      run: make deploy-pc
